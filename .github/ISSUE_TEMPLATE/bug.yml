name: Bug report
description: Something in Cocobox doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Cocobox version
      description: Settings › About
      placeholder: "0.10.4"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "macOS 15.4, Apple M3 / Docker on Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model, if it matters
      placeholder: "Claude Code, claude-opus-5-5"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Remove passwords, tokens and private data first.
